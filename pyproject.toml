[project]
name = "testclaw"
version = "2.0.0"
description = "Full-chain intelligent testing platform powered by FastAPI, LangGraph, and Playwright."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langgraph>=0.2.0",
    "langsmith>=0.1.0",
    "playwright>=1.47.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-playwright>=0.5.0",
    "allure-pytest>=2.13.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "faker>=30.0.0",
    "openapi-schema-validator>=0.6.0",
    "python-multipart>=0.0.12",
    "cryptography>=43.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "Pillow>=10.4.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "PyYAML>=6.0.2",
    "alibabacloud-oss-v2>=1.2.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "ruff>=0.15.13",
]
