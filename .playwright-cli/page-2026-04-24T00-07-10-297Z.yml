okie-get <name> get a specific cookie by name cookie-set <name> <value> set a cookie with optional flags cookie-delete <name> delete a specific cookie cookie-clear clear all cookies localstorage-list list all localstorage key-value pairs localstorage-get <key> get a localstorage item by key localstorage-set <key> <value> set a localstorage item localstorage-delete <key> delete a localstorage item localstorage-clear clear all localstorage sessionstorage-list list all sessionstorage key-value pairs sessionstorage-get <key> get a sessionstorage item by key sessionstorage-set <key> <value> set a sessionstorage item sessionstorage-delete <key> delete a sessionstorage item sessionstorage-clear clear all sessionstorage Network: route <pattern> mock network requests matching a url pattern route-list list all active network routes unroute [pattern] remove routes matching a pattern (or all routes) network-state-set <state> set the browser network state to online or offline DevTools: console [min-level] list console messages run-code [code] run playwright code snippet network list all network requests since loading the page tracing-start start trace recording tracing-stop stop trace recording video-start [filename] start video recording video-stop stop video recording video-chapter <title> add a chapter marker to the video recording show show browser devtools pause-at <location> run the test up to a specific location and pause there resume resume the test execution step-over step over the next call in the test Install: install initialize workspace install-browser [browser] install browser Browser sessions: list list browser sessions close-all close all browser sessions kill-all forcefully kill all browser sessions (for stale/zombie processes) Global options: --help [command] print help --raw output only the result value, without status and code --version print version"
